name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check release version
        run: |
          version=$(python3 -c 'import json; print(json.load(open("mygo.json"))["version"])')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag must match mygo.json version: v$version"
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: go test ./...

      - name: Install NSIS
        run: brew install makensis

      - name: Build release packages
        run: |
          mygo_version=$(go list -m -f '{{.Version}}' github.com/egoist/mygo)
          go run "github.com/egoist/mygo/cmd/mygo@$mygo_version" build -platform windows/amd64,darwin/universal

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv build/windows-amd64/GoLabel.exe "build/windows-amd64/golabel-${RELEASE_VERSION}-windows-amd64.exe"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --title "GoLabel $GITHUB_REF_NAME" --notes-from-tag \
            "build/windows-amd64/golabel-setup-${RELEASE_VERSION}-amd64.exe" \
            "build/windows-amd64/golabel-${RELEASE_VERSION}-windows-amd64.exe" \
            build/windows-amd64/THIRD-PARTY-NOTICES.txt \
            "build/darwin-universal/golabel-${RELEASE_VERSION}.dmg"
