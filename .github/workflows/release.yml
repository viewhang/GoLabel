name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check release version
        run: |
          version=$(python3 -c 'import json; print(json.load(open("mygo.json"))["version"])')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag must match mygo.json version: v$version"
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: go test ./...

      - name: Install NSIS
        run: brew install makensis

      - name: Build release packages
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [[ -z "$MYGO_UPDATER_PRIVATE_KEY" ]]; then
            echo "::error::Set the MYGO_UPDATER_PRIVATE_KEY repository secret before releasing"
            exit 1
          fi
          printf '## %s\n\n' "$RELEASE_VERSION" > CHANGELOG.md
          git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" >> CHANGELOG.md
          mygo_version=$(go list -m -f '{{.Version}}' github.com/egoist/mygo)
          go run "github.com/egoist/mygo/cmd/mygo@$mygo_version" build -platform windows/amd64,darwin/universal

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --title "GoLabel $GITHUB_REF_NAME" --notes-from-tag \
            "build/windows-amd64/golabel-setup-${RELEASE_VERSION}-amd64.exe" \
            build/windows-amd64/GoLabel.exe \
            build/windows-amd64/THIRD-PARTY-NOTICES.txt \
            "build/darwin-universal/golabel-${RELEASE_VERSION}.dmg" \
            "build/windows-amd64/golabel-${RELEASE_VERSION}-windows-amd64.tar.gz" \
            build/windows-amd64/update-windows-amd64.json \
            "build/darwin-universal/golabel-${RELEASE_VERSION}-darwin-universal.tar.gz" \
            build/darwin-universal/update-darwin-universal.json
